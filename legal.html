<style>
:root {
    --bg: #050505;

    --border: #2a2a2a;
    --text: #f5f5f5;
    --muted: #a5a5a5;
    --radius: 20px;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    line-height: 1.65;
}

a {
    color: var(--text);
}

.container {
    width: min(900px, 100%);
    margin: auto;
    padding: 24px 18px 60px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 150px;
    height: 150px;
    object-fit: contain;
    border-radius: 14px;
    background: #fff;
    color: #000;
    display: grid;
    place-items: center;
    font-size: 23px;
    font-weight: 900;
}

.brand-name {
    font-weight: 800;
    font-size: 17px;
}

.brand-sub {
    color: var(--muted);
    font-size: 13px;
}

h1 {
    font-size: clamp(36px, 8vw, 58px);
    line-height: 1.05;
    letter-spacing: -2px;
    margin: 50px 0 12px;
}

.subtitle {
    color: var(--muted);
    font-size: 18px;
}

.toolbar {
    margin: 30px 0;
    display: grid;
    gap: 12px;
}

.tabs {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
}

.tabs button {
    flex: 1;
    border: 0;
    padding: 12px;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-weight: 700;
}

.tabs button.active {
    background: var(--surface-2);
    color: var(--text);
}

.language {
    width: 100%;
    padding: 13px 14px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
}

.meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 0 30px;
}

.badge {
    padding: 6px 11px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
}

.notice {
    padding: 18px;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    margin-bottom: 30px;
    color: var(--muted);
}

.legal-section {
    margin-bottom: 34px;
}

.legal-section h2 {
    font-size: 25px;
    line-height: 1.2;
    margin-bottom: 10px;
}

.card {
    padding: 20px;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    margin-top: 30px;
}

.hidden {
    display: none;
}

footer {
    border-top: 1px solid var(--border);
    margin-top: 55px;
    padding-top: 25px;
    color: var(--muted);
    font-size: 13px;
}

@media (max-width: 430px) {
    .container {
        padding-left: 14px;
        padding-right: 14px;
    }

    h1 {
        font-size: 38px;
    }

    .tabs button {
        font-size: 14px;
        padding: 10px 7px;
    }
}
</style>
</head>

/*
========================================================
SAFE TEXT ESCAPING
========================================================
*/

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
========================================================
RENDER DOCUMENT
========================================================
*/

function renderDocument(type) {

    const code =
        languageSelect.value;

    const data =
        legal[code] || legal.en;

    const content =
        type === "privacy"
            ? data.privacyText
            : data.termsText;

    const container =
        document.getElementById("legalContent");

    container.innerHTML = "";

    content.forEach(section => {

        const article =
            document.createElement("section");

        article.className =
            "legal-section";

        const heading =
            document.createElement("h2");

        heading.textContent =
            section[0];

        const paragraph =
            document.createElement("p");

        paragraph.textContent =
            section[1];

        article.appendChild(heading);
        article.appendChild(paragraph);

        container.appendChild(article);

    });

}


/*
========================================================
APPLY LANGUAGE
========================================================
*/

function applyLanguage(code) {

    const data =
        legal[code] || legal.en;

    document.documentElement.lang =
        code;

    document.documentElement.dir =
        code === "ar"
            ? "rtl"
            : "ltr";

    document.getElementById("pageTitle")

    document.getElementById("pageSubtitle")

    document.getElementById("effective")
        .textContent = data.effective;

    document.getElementById("notice")
        .textContent = data.notice;

    languageSelect.value =
        code;

    localStorage.setItem(
        "sajmaLegalLanguage",
        code
    );

    renderDocument(
        document.getElementById("privacyTab")
            .classList.contains("active")
            ? "privacy"
            : "terms"
    );

}


/*
========================================================
DOCUMENT SWITCHER
========================================================
*/

function showDocument(type) {

    const privacyTab =
        document.getElementById("privacyTab");

    const termsTab =
        document.getElementById("termsTab");

    if (type === "privacy") {

        privacyTab.classList.add("active");
        termsTab.classList.remove("active");

        document.title =
            "Sajma Studio — Privacy Policy";

    } else {

        privacyTab.classList.remove("active");
        termsTab.classList.add("active");

        document.title =
            "Sajma Studio — Terms of Use";

    }

    renderDocument(type);

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/*
========================================================
LANGUAGE CHANGE
========================================================
*/

languageSelect.addEventListener(
    "change",
    function () {

        applyLanguage(
            this.value
        );

    }
);


/*
========================================================
INITIAL LANGUAGE
========================================================
*/

const savedLanguage =
    localStorage.getItem(
        "sajmaLegalLanguage"
    );

const browserLanguage =
    (navigator.language || "en")
        .toLowerCase()
        .split("-")[0];

const initialLanguage =
    savedLanguage &&
    legal[savedLanguage]
        ? savedLanguage
        : legal[browserLanguage]
            ? browserLanguage
            : "en";


applyLanguage(
    initialLanguage
);

showDocument("privacy");

</script>
